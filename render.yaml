services:
  - type: web
    name: ensambla-backend
    runtime: docker
    branch: main
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    # El deploy lo dispara el pipeline de main (job deploy en deploy-main.yml,
    # vía RENDER_DEPLOY_HOOK_URL), por eso el auto-deploy de Render queda apagado.
    autoDeployTrigger: "off"
    healthCheckPath: /api/auth/csrf
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FRONTEND_URL
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ENSAMBLA_WHATSAPP_PROVEEDOR
        sync: false
      - key: ENSAMBLA_WHATSAPP_NUMERO_BOT
        sync: false
      - key: ENSAMBLA_WHATSAPP_WEBHOOK_SECRETO
        sync: false
      - key: ENSAMBLA_WHATSAPP_EVOLUTION_URL
        sync: false
      - key: ENSAMBLA_WHATSAPP_EVOLUTION_API_KEY
        sync: false
      - key: ENSAMBLA_WHATSAPP_EVOLUTION_INSTANCIA
        sync: false
