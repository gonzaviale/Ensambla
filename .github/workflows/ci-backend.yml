name: CI backend (build y test)

on:
  push:
    branches: [dev, stg, main]
    paths: ["backend/**", "scripts/**", ".github/workflows/ci-backend.yml"]
  pull_request:
    branches: [dev, stg, main]
    paths: ["backend/**", "scripts/**", ".github/workflows/ci-backend.yml"]

jobs:
  backend:
    name: ci-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Los tests usan Testcontainers (postgres:17-alpine); ubuntu-latest ya trae Docker.
      # `verify` también exige 100 % de cobertura por clase (JaCoCo).
      - name: Build y tests
        run: ./mvnw -B verify

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Tests de evaluación de cuadernos
        working-directory: .
        env:
          ENSAMBLA_EVAL_JAR: ${{ github.workspace }}/backend/target/backend-0.0.1-SNAPSHOT.jar
        run: python -m unittest discover -s scripts/tests -v

      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: backend/target/site/jacoco
          if-no-files-found: ignore
