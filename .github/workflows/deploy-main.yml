name: Deploy main (build y despliegue en el VPS)

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "deploy/**", ".github/workflows/deploy-main.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build y tests
        run: ./mvnw -B verify

      - name: Validar imagen Docker
        run: docker build -t ensambla-backend .

  build-test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # El VPS (Contabo) clona el repo y reconstruye con Docker Compose. La clave SSH sólo puede ejecutar
  # deploy/deploy.sh (restricción command= en authorized_keys) y recibe el SHA exacto a desplegar.
  deploy:
    needs: [build-test-backend, build-test-frontend]
    runs-on: ubuntu-latest
    environment: production
    env:
      SITIO_URL: https://ensambla.com.ar
    steps:
      - name: Preparar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Desplegar en el VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "${{ github.sha }}" | tee salida-deploy.txt
          grep -qx "DEPLOY_OK commit=${{ github.sha }}" salida-deploy.txt

      - name: Verificar el sitio
        run: curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "$SITIO_URL/api/auth/csrf" > /dev/null
