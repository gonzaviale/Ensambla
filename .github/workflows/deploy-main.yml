name: Deploy main (build y despliegue)

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-main.yml"]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build y tests
        run: ./mvnw -B verify

      - name: Validar imagen Docker
        run: docker build -t ensambla-backend .

  # Por ahora Render despliega solo al pushear a main (Auto-Deploy activo).
  # Para pasar a desplegar desde el pipeline (T-036): descomentar este job y
  # poner Auto-Deploy en "No" en Render (si no, se despliega dos veces).
