name: Deploy main (build y despliegue)

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-main.yml"]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build y tests
        run: ./mvnw -B verify

      - name: Validar imagen Docker
        run: docker build -t ensambla-backend .

  # Render tiene el Auto-Deploy apagado: sólo despliega cuando este job
  # dispara el deploy hook, después de que build-test pasó.
  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Disparar deploy en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
