name: ensambla

services:
  postgres:
    image: postgres:17-alpine
    container_name: ensambla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ENSAMBLA_POSTGRES_DB:-ensambla}
      POSTGRES_USER: ${ENSAMBLA_POSTGRES_USER:-ensambla_user}
      POSTGRES_PASSWORD: ${ENSAMBLA_POSTGRES_PASSWORD:-ensambla_pass}
    ports:
      - "${ENSAMBLA_POSTGRES_PORT:-5435}:5432"
    volumes:
      - ensambla-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENSAMBLA_POSTGRES_USER:-ensambla_user} -d ${ENSAMBLA_POSTGRES_DB:-ensambla}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Evolution API: puente gratuito y no oficial a WhatsApp (se vincula escaneando un QR). Ver docs/whatsapp-evolution.md.
  # Es opcional: sin él la app anda igual, con el proveedor "simulado".
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: ensambla-evolution
    restart: unless-stopped
    profiles: ["whatsapp"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ENSAMBLA_EVOLUTION_PORT:-8081}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_URL: http://localhost:${ENSAMBLA_EVOLUTION_PORT:-8081}
      AUTHENTICATION_API_KEY: ${ENSAMBLA_WHATSAPP_EVOLUTION_API_KEY:-cambiar-esta-clave}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${ENSAMBLA_POSTGRES_USER:-ensambla_user}:${ENSAMBLA_POSTGRES_PASSWORD:-ensambla_pass}@postgres:5432/${ENSAMBLA_POSTGRES_DB:-ensambla}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: ensambla
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: ${ENSAMBLA_WEBHOOK_URL:-http://host.docker.internal:8080/api/whatsapp/webhook}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    volumes:
      - ensambla-evolution:/evolution/instances

volumes:
  ensambla-pgdata:
  ensambla-evolution:
