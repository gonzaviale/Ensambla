#SERVER
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.port=${PORT:8080}

#CORS
frontend.url=${FRONTEND_URL:http://localhost:5173}

#DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/ensambla}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ensambla_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ensambla_pass}

#SWAGGER
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
