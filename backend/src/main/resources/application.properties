spring.application.name=ensambla-backend
spring.session.jdbc.initialize-schema=never
spring.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
spring.output.ansi.enabled=always
spring.config.import=optional:classpath:application-ensambla-secrets.properties

#DATABASE
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# FLYWAY
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# Entorno activo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# SWAGGER - deshabilitado por defecto (se habilita por perfil)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# IA - lectura de cuadernos (ver infrastructure/ia/IaConfig). "simulado" no llama a ningún proveedor.
ensambla.ia.proveedor=${ENSAMBLA_IA_PROVEEDOR:simulado}
ensambla.ia.modelo=${ENSAMBLA_IA_MODELO:}
ensambla.ia.api-key=${ENSAMBLA_IA_API_KEY:}
ensambla.ia.timeout=${ENSAMBLA_IA_TIMEOUT:60s}
ensambla.ia.max-paginas-por-lectura=10
ensambla.ia.umbral-confianza=0.8

# ALMACENAMIENTO - archivos en un bucket privado compatible con S3 (ver infrastructure/almacenamiento).
# En desarrollo es el MinIO del docker-compose.yml; sólo se accede con URLs firmadas.
ensambla.almacenamiento.endpoint=${ENSAMBLA_ALMACENAMIENTO_ENDPOINT:http://localhost:9000}
ensambla.almacenamiento.region=${ENSAMBLA_ALMACENAMIENTO_REGION:us-east-1}
ensambla.almacenamiento.access-key=${ENSAMBLA_ALMACENAMIENTO_ACCESS_KEY:ensambla_minio}
ensambla.almacenamiento.secret-key=${ENSAMBLA_ALMACENAMIENTO_SECRET_KEY:ensambla_minio_pass}
ensambla.almacenamiento.bucket=${ENSAMBLA_ALMACENAMIENTO_BUCKET:ensambla-archivos}
ensambla.almacenamiento.expiracion-url=${ENSAMBLA_ALMACENAMIENTO_EXPIRACION_URL:15m}
ensambla.almacenamiento.inicializar-bucket=${ENSAMBLA_ALMACENAMIENTO_INICIALIZAR_BUCKET:true}
