spring.application.name=ensambla-backend

# Nominatim: búsqueda explícita, caché de 24 h y máximo una consulta cada 1,1 s por instancia.
ensambla.geocodificacion.url=${ENSAMBLA_GEOCODIFICACION_URL:https://nominatim.openstreetmap.org}
ensambla.geocodificacion.user-agent=${ENSAMBLA_GEOCODIFICACION_USER_AGENT:Ensambla/0.1 (configuracion de direccion comercial)}
ensambla.geocodificacion.timeout=${ENSAMBLA_GEOCODIFICACION_TIMEOUT:5s}
spring.session.jdbc.initialize-schema=never
spring.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
spring.output.ansi.enabled=always
spring.config.import=optional:classpath:application-ensambla-secrets.properties

#DATABASE
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# FLYWAY
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# Entorno activo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# SWAGGER - deshabilitado por defecto (se habilita por perfil)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# IA (ver infrastructure/ia/IaConfig y ProveedorIa). Un selector para todo: simulado (sin costo, no llama a nadie),
# anthropic (API de Anthropic) o bedrock (Claude en Amazon Bedrock). Atiende la lectura de cuadernos y a Sami, salvo
# que Sami lo pise (ensambla.sami.ia.proveedor). ENSAMBLA_IA_MODELO pisa el modelo de visión del proveedor.
ensambla.ia.proveedor=${ENSAMBLA_IA_PROVEEDOR:simulado}
ensambla.ia.modelo=${ENSAMBLA_IA_MODELO:}
ensambla.ia.timeout=${ENSAMBLA_IA_TIMEOUT:60s}
ensambla.ia.max-paginas-por-lectura=10
ensambla.ia.umbral-confianza=0.8
# Credenciales y modelos de cada proveedor (rápido: taller y primera consulta de Sami; avanzado: escalado de Sami;
# visión: lectura de cuadernos).
ensambla.ia.proveedores.anthropic.api-key=${ENSAMBLA_IA_API_KEY:}
ensambla.ia.proveedores.anthropic.modelo-rapido=${ENSAMBLA_IA_ANTHROPIC_MODELO_RAPIDO:claude-haiku-4-5}
ensambla.ia.proveedores.anthropic.modelo-avanzado=${ENSAMBLA_IA_ANTHROPIC_MODELO_AVANZADO:claude-sonnet-4-6}
ensambla.ia.proveedores.anthropic.modelo-vision=${ENSAMBLA_IA_ANTHROPIC_MODELO_VISION:claude-haiku-4-5}
ensambla.ia.proveedores.bedrock.region=${ENSAMBLA_IA_BEDROCK_REGION:us-east-1}
ensambla.ia.proveedores.bedrock.perfil-aws=${ENSAMBLA_IA_BEDROCK_PERFIL_AWS:}
ensambla.ia.proveedores.bedrock.modelo-rapido=${ENSAMBLA_IA_BEDROCK_MODELO_RAPIDO:us.anthropic.claude-haiku-4-5-20251001-v1:0}
ensambla.ia.proveedores.bedrock.modelo-avanzado=${ENSAMBLA_IA_BEDROCK_MODELO_AVANZADO:us.anthropic.claude-sonnet-4-6}
ensambla.ia.proveedores.bedrock.modelo-vision=${ENSAMBLA_IA_BEDROCK_MODELO_VISION:us.anthropic.claude-haiku-4-5-20251001-v1:0}

# Sami - asistente que arma el sistema (ver docs/sami-asistente.md). Primero diccionario y preguntas, sin costo;
# la IA sólo se consulta si no alcanzan. Lo de ensambla.sami.ia.* que quede vacío sale de ensambla.ia.* (el proveedor
# global y sus credenciales y modelos); con valor, manda lo de Sami.
ensambla.sami.umbral-confianza=${ENSAMBLA_SAMI_UMBRAL:0.7}
ensambla.sami.max-preguntas=${ENSAMBLA_SAMI_MAX_PREGUNTAS:3}
ensambla.sami.limite-diario-ia=${ENSAMBLA_SAMI_LIMITE_DIARIO:20}
ensambla.sami.limite-diario-taller=${ENSAMBLA_SAMI_LIMITE_TALLER:60}
ensambla.sami.ia.proveedor=${ENSAMBLA_SAMI_IA_PROVEEDOR:}
ensambla.sami.ia.region=${ENSAMBLA_SAMI_IA_REGION:}
ensambla.sami.ia.perfil-aws=${ENSAMBLA_SAMI_IA_PERFIL_AWS:}
ensambla.sami.ia.modelo-rapido=${ENSAMBLA_SAMI_IA_MODELO_RAPIDO:}
ensambla.sami.ia.modelo-avanzado=${ENSAMBLA_SAMI_IA_MODELO_AVANZADO:}
ensambla.sami.ia.timeout=${ENSAMBLA_SAMI_IA_TIMEOUT:30s}
ensambla.sami.ia.max-tokens-taller=${ENSAMBLA_SAMI_IA_MAX_TOKENS_TALLER:900}

# SUBIDA DE FOTOS - límites del pedido multipart (POST /api/lotes). El dominio valida 10 MB por foto y 10 fotos.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# Cola de IA; deshabilitar en una instancia de evaluación.
ensambla.ia.procesamiento.habilitado=${ENSAMBLA_IA_WORKER:true}
ensambla.ia.procesamiento.limite-diario=${ENSAMBLA_IA_LIMITE_DIARIO:100}

# Motor de monitoreo de avisos: corre solo cada 5 minutos.
ensambla.avisos.motor.habilitado=${ENSAMBLA_AVISOS_MOTOR:true}
ensambla.avisos.motor.intervalo=${ENSAMBLA_AVISOS_INTERVALO:300000}
