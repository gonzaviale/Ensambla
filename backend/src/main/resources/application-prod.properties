#SERVER
server.port=${PORT}

#CORS
frontend.url=${FRONTEND_URL}

#DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

#SWAGGER
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

#ALMACENAMIENTO
# Hasta definir el almacenamiento de producción no se crea el bucket al arrancar (no hay MinIO en Render).
ensambla.almacenamiento.inicializar-bucket=${ENSAMBLA_ALMACENAMIENTO_INICIALIZAR_BUCKET:false}
