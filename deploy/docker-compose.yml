name: ensambla-prod

# Despliegue en un VPS: Caddy (HTTPS + frontend + proxy /api), backend, Postgres.
# Evolution API (WhatsApp) queda apagada hasta activarla con: docker compose --profile whatsapp up -d
# Sólo Caddy publica puertos (80 y 443); lo demás vive en la red interna de Docker.

services:
  web:
    build:
      context: ../frontend
      dockerfile: ../deploy/web.Dockerfile
    container_name: ensambla-web
    restart: unless-stopped
    labels:
      ensambla.commit: ${GIT_SHA:-desconocido}
    depends_on:
      - backend
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backend:
    build:
      context: ../backend
    container_name: ensambla-backend
    restart: unless-stopped
    # Lo completa deploy.sh con el commit desplegado (docker inspect lo muestra).
    labels:
      ensambla.commit: ${GIT_SHA:-desconocido}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=50}
      FRONTEND_URL: https://${DOMINIO}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ensambla}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ensambla_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      ENSAMBLA_IA_PROVEEDOR: ${ENSAMBLA_IA_PROVEEDOR:-simulado}
      ENSAMBLA_IA_API_KEY: ${ENSAMBLA_IA_API_KEY:-}
      # Con ACCESO_RESTRINGIDO=true sólo los dueños con email en ACCESO_EMAILS (separados por coma) usan la IA.
      ENSAMBLA_IA_ACCESO_RESTRINGIDO: ${ENSAMBLA_IA_ACCESO_RESTRINGIDO:-false}
      ENSAMBLA_IA_ACCESO_EMAILS: ${ENSAMBLA_IA_ACCESO_EMAILS:-}
      ENSAMBLA_IA_MODELO: ${ENSAMBLA_IA_MODELO:-}
      ENSAMBLA_IA_TIMEOUT: ${ENSAMBLA_IA_TIMEOUT:-60s}
      ENSAMBLA_IA_LIMITE_DIARIO: ${ENSAMBLA_IA_LIMITE_DIARIO:-100}
      ENSAMBLA_IA_WORKER: ${ENSAMBLA_IA_WORKER:-true}
      ENSAMBLA_IA_ANTHROPIC_MODELO_RAPIDO: ${ENSAMBLA_IA_ANTHROPIC_MODELO_RAPIDO:-claude-haiku-4-5}
      ENSAMBLA_IA_ANTHROPIC_MODELO_AVANZADO: ${ENSAMBLA_IA_ANTHROPIC_MODELO_AVANZADO:-claude-sonnet-4-6}
      ENSAMBLA_IA_ANTHROPIC_MODELO_VISION: ${ENSAMBLA_IA_ANTHROPIC_MODELO_VISION:-claude-haiku-4-5}
      # Bedrock: en el VPS no hay ~/.aws, las credenciales viajan como variables AWS_*.
      ENSAMBLA_IA_BEDROCK_REGION: ${ENSAMBLA_IA_BEDROCK_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Sami: vacío usa el proveedor global de IA.
      ENSAMBLA_SAMI_LIMITE_DIARIO: ${ENSAMBLA_SAMI_LIMITE_DIARIO:-20}
      ENSAMBLA_SAMI_LIMITE_TALLER: ${ENSAMBLA_SAMI_LIMITE_TALLER:-60}
      ENSAMBLA_SAMI_IA_PROVEEDOR: ${ENSAMBLA_SAMI_IA_PROVEEDOR:-}
      ENSAMBLA_SAMI_IA_REGION: ${ENSAMBLA_SAMI_IA_REGION:-}
      ENSAMBLA_SAMI_IA_MODELO_RAPIDO: ${ENSAMBLA_SAMI_IA_MODELO_RAPIDO:-}
      ENSAMBLA_SAMI_IA_MODELO_AVANZADO: ${ENSAMBLA_SAMI_IA_MODELO_AVANZADO:-}
      # Motores programados.
      ENSAMBLA_AVISOS_MOTOR: ${ENSAMBLA_AVISOS_MOTOR:-true}
      ENSAMBLA_AVISOS_PERIODO_DIAS: ${ENSAMBLA_AVISOS_PERIODO_DIAS:-30}
      ENSAMBLA_AVISOS_BAJA_ROTACION_FACTOR: ${ENSAMBLA_AVISOS_BAJA_ROTACION_FACTOR:-0.5}
      ENSAMBLA_AVISOS_IMPACTO: ${ENSAMBLA_AVISOS_IMPACTO:-true}
      ENSAMBLA_AVISOS_IMPACTO_VENTANA_DIAS: ${ENSAMBLA_AVISOS_IMPACTO_VENTANA_DIAS:-14}
      ENSAMBLA_PRUEBAS_WORKER: ${ENSAMBLA_PRUEBAS_WORKER:-true}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-2h}
      ENSAMBLA_MP_HABILITADO: ${ENSAMBLA_MP_HABILITADO:-false}
      ENSAMBLA_MP_PRODUCCION: ${ENSAMBLA_MP_PRODUCCION:-false}
      ENSAMBLA_MP_ACCESS_TOKEN: ${ENSAMBLA_MP_ACCESS_TOKEN:-}
      ENSAMBLA_MP_COLLECTOR_ID: ${ENSAMBLA_MP_COLLECTOR_ID:-}
      ENSAMBLA_MP_APPLICATION_ID: ${ENSAMBLA_MP_APPLICATION_ID:-}
      ENSAMBLA_MP_WEBHOOK_SECRET: ${ENSAMBLA_MP_WEBHOOK_SECRET:-}
      ENSAMBLA_MP_NOTIFICATION_URL: ${ENSAMBLA_MP_NOTIFICATION_URL:-}
      ENSAMBLA_MP_RETURN_URL: ${ENSAMBLA_MP_RETURN_URL:-}
      # WhatsApp: con ENSAMBLA_WHATSAPP_PROVEEDOR=evolution y COMPOSE_PROFILES=whatsapp (ver .env.example).
      ENSAMBLA_WHATSAPP_PROVEEDOR: ${ENSAMBLA_WHATSAPP_PROVEEDOR:-simulado}
      ENSAMBLA_WHATSAPP_NUMERO_BOT: ${ENSAMBLA_WHATSAPP_NUMERO_BOT:-}
      ENSAMBLA_WHATSAPP_WEBHOOK_SECRETO: ${ENSAMBLA_WHATSAPP_WEBHOOK_SECRETO:-}
      ENSAMBLA_WHATSAPP_EVOLUTION_URL: http://evolution-api:8080
      ENSAMBLA_WHATSAPP_EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      ENSAMBLA_WHATSAPP_EVOLUTION_INSTANCIA: ${ENSAMBLA_WHATSAPP_EVOLUTION_INSTANCIA:-ensambla}
      ENSAMBLA_WHATSAPP_ATENCION_HABILITADA: ${ENSAMBLA_WHATSAPP_ATENCION_HABILITADA:-true}
    volumes:
      - backend-datos:/app/datos

  postgres:
    image: postgres:17-alpine
    container_name: ensambla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ensambla}
      POSTGRES_USER: ${POSTGRES_USER:-ensambla_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    # Sólo en el loopback del VPS: se entra con un túnel SSH (DBeaver, Beekeeper, psql), nunca desde internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ensambla_user} -d ${POSTGRES_DB:-ensambla}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ensambla-redis
    profiles: ["whatsapp"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  evolution-api:
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:v2.3.7}
    container_name: ensambla-evolution
    profiles: ["whatsapp"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SERVER_URL: http://evolution-api:8080
      # Compose interpola también los servicios de perfiles apagados: no puede ser obligatoria.
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-ensambla_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ensambla}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: ensambla
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
      # El backend recibe los mensajes por la red interna; Evolution no manda headers en el webhook global,
      # así que el secreto viaja como parámetro.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://backend:8080/api/whatsapp/webhook?token=${ENSAMBLA_WHATSAPP_WEBHOOK_SECRETO:-}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      # Hace falta para poder bajar las fotos de los mensajes.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
    volumes:
      - evolution-instances:/evolution/instances
    # Sólo en el loopback del VPS: se entra con un túnel SSH (ssh -L 8081:localhost:8081 ...).
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  pgdata:
  backend-datos:
  caddy-data:
  caddy-config:
  evolution-instances:
